services:
  music-link:
    build:
      context: .
      args:
        MUSIC_LINK_THEMES: ${MUSIC_LINK_THEMES:-base}
        MUSIC_LINK_DEFAULT_THEME: ${MUSIC_LINK_DEFAULT_THEME:-base}
        MUSIC_LINK_THEME_COLOR: ${MUSIC_LINK_THEME_COLOR:-}
        MUSIC_LINK_THEME_COLOR_DARK: ${MUSIC_LINK_THEME_COLOR_DARK:-}
    restart: unless-stopped
    environment:
      MUSIC_LINK_SITE_URL: ${MUSIC_LINK_SITE_URL:?Set the public HTTPS origin, for example https://music.example.com}
      MUSIC_LINK_NAVIDROME_URL: ${MUSIC_LINK_NAVIDROME_URL:-http://host.docker.internal:4533}
      MUSIC_LINK_THEME: ${MUSIC_LINK_THEME:-}
      MUSIC_LINK_THEME_COLOR: ${MUSIC_LINK_THEME_COLOR:-}
      MUSIC_LINK_THEME_COLOR_DARK: ${MUSIC_LINK_THEME_COLOR_DARK:-}
    ports:
      - "127.0.0.1:8787:8787"
    extra_hosts:
      - host.docker.internal:host-gateway
